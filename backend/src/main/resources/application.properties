spring.application.name=electricity-bill-management
server.port=8080

# MySQL Database Configuration
# You can set DB_URL, DB_USERNAME, and DB_PASSWORD via environment variables.
# Fallback defaults are configured for seamless local development.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/electricity_billing?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Aaditya@777}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JSON formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Logging
logging.level.com.electricity.billing=INFO
logging.level.org.springframework.web=INFO
